name: CI-CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Python
        run: python3 --version

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Build application
        run: |
          mkdir -p dist
          cp app.py dist/app.py

      - uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: dist/app.py

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-app
      - name: Test application
        run: python3 -m py_compile app.py

  security:
    name: Security
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Check for accidental AWS keys
        run: |
          if grep -nE 'AKIA[0-9A-Z]{16}' app.py; then
            echo "Potential hard-coded AWS access key found"
            exit 1
          fi
          echo "Basic credential check passed"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: security
    steps:
      - run: echo "Deployment stage ready; AWS OIDC and EC2 setup pending"

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - run: echo "Pipeline smoke test passed"
