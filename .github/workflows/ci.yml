name: Python CI CD

on:
  push:
    branches:
      - main

jobs:

  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Python
        run: python -m py_compile app.py

  security:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Security Check
        run: echo "Security Check Passed"

  build:
    runs-on: ubuntu-latest
    needs: security

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: echo "Build Successful"

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Run Test
        run: python test_app.py
  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Create SSH Key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 400 key.pem

      - name: Copy Application
        run: |
          scp -i key.pem \
          -o StrictHostKeyChecking=no \
          app.py \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/

      - name: Start Application
        run: |
          ssh -i key.pem \
          -o StrictHostKeyChecking=no \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "pkill -f app.py || true
          nohup python3 app.py > app.log 2>&1 &"

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Verify Application
        run: |
          sleep 10
          curl http://${{ secrets.EC2_HOST }}:8000/health