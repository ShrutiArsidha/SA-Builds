name: Python CI CD

on:
  push:
    branches:
      - main

jobs:

  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Python
        run: python -m py_compile app.py

  security:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Security Check
        run: echo "Security Check Passed"

  build:
    runs-on: ubuntu-latest
    needs: security

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: echo "Build Successful"

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Run Test
        run: python test_app.py

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Create SSH Key
        run: |
          echo '${{ secrets.SSH_PRIVATE_KEY }}' > key.pem
          chmod 600 key.pem

      - name: Check Key
        run: |
          ls -l key.pem

      - name: Test SSH
        run: |
          ssh -o StrictHostKeyChecking=no \
          -i key.pem \
          ec2-user@3.79.16.20 \
          "hostname"

      - name: Copy Application
        run: |
          scp -o StrictHostKeyChecking=no \
          -i key.pem \
          app.py \
          ec2-user@3.79.16.20:/home/ec2-user/

      - name: Start Application
        run: |
          ssh -o StrictHostKeyChecking=no \
          -i key.pem \
          ec2-user@3.79.16.20 \
          "pkill -f app.py || true && nohup python3 /home/ec2-user/app.py > app.log 2>&1 &"

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Verify Application
        run: |
          sleep 15
          curl http://3.79.16.20:8000/health