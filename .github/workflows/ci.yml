name: Python CI CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  # Stage 1 - Validate
  validate:
    name: Validate Python Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python Syntax
        run: |
          python -m py_compile app.py test.py

  # Stage 2 - Build
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Application
        run: |
          mkdir dist
          cp app.py dist/

      - name: Save Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: dist/

  # Stage 3 - Test
  test:
    name: Test Application
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Unit Tests
        run: |
          python test.py

  # Stage 4 - Deploy
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: dist/

      - name: Deployment Demo
        run: |
          echo "All checks passed. Application is ready for deployment."
          ls -la dist/
