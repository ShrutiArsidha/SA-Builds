name: Python CI CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Python
        run: python -m py_compile app.py

  build:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: echo "Build Successful"

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Run Test
        run: echo "Test Successful"

    deploy: Deploy To EC2
    run: |
      aws ssm send-command \
        --instance-ids i-09f0df14b37edbc3c \
        --document-name AWS-RunShellScript \
        --parameters commands="git --version > /home/ec2-user/git.txt"

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Smoke Test
        run: echo "Deployment completed successfully"